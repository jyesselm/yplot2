name: Catalog build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  catalog:
    name: Build and verify catalog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[stats,dev]"
          pip install nbconvert ipykernel

      - name: Run test suite
        run: pytest -q

      - name: Build catalog (static index + blocking style gate)
        # The fingerprint gate is BLOCKING: CI fails when a cataloged demo is unstyled.
        # Thumbnails are best-effort and do not block the build.
        run: python -m yplot2.catalog_build.build --out-dir catalog

      - name: Verify catalog.json exists
        run: |
          test -f catalog/catalog.json || (echo "catalog.json missing" && exit 1)
          python -c "import json; d=json.load(open('catalog/catalog.json')); assert d['schema_version']==1"
